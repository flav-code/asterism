[package]
name = "mdb-app"
description = "Desktop window for mdb-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gpui-kit = "0.9.0"
mdb-core = { path = "../core" }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "net"] }
# Only for `--features snapshot`: GPUI renders the window into a PNG itself, no screen-recording permission needed.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", optional = true, features = ["test-support"] }

[features]
snapshot = ["dep:gpui_platform"]
