[package]
name = "asterism"
description = "Asterism: what every AI coding agent session on this machine runs, says and costs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
gpui-kit = "0.9.0"
asterism-core = { path = "../core" }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "net"] }
# Only for `--features snapshot`: GPUI renders the window into a PNG itself, no screen-recording permission needed.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", optional = true, features = ["test-support"] }
sysinfo = "0.40.1"
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Updates: ask GitHub for the latest release and download it (HTTPS with rustls), check its SHA-256.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
sha2 = "0.10.9"

[features]
snapshot = ["dep:gpui_platform"]
