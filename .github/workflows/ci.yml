name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The window (GPUI) is built on Windows only: macOS minutes cost ten times more on a private repository
      # and it is checked on a Mac before each push; Linux would need GPUI's system libraries.
      SCOPE: ${{ matrix.os == 'windows-latest' && '--workspace' || '--workspace --exclude asterism' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy ${{ env.SCOPE }} --all-targets -- -D warnings
      - name: Test
        run: cargo test ${{ env.SCOPE }}
