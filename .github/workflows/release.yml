# Publishes a release when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0):
# the macOS disk images (Apple silicon and Intel) and the Windows installer, attached to a GitHub release.
# The app's own updater reads that release. Run by hand, it builds everything but publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: check
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: TARGET=${{ matrix.target }} scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/*.dmg

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p asterism
      # Nobody else runs it on Windows before release: it must start, stay up, and show its window (the
      # screenshot, with the logo in the taskbar, is kept with the run).
      - name: Asterism starts
        shell: pwsh
        run: |
          $p = Start-Process target\release\asterism.exe -PassThru -RedirectStandardError "$PWD\asterism-err.txt"
          Start-Sleep 20
          # The window's own menu (its icon in the title bar) has the app's items, and the taskbar icon's menu
          # (a second asterism.exe --dock-action 0) hands its command to the open window, which says this copy
          # doesn't update itself: the dialog is in the screenshot.
          Add-Type @'
          using System; using System.Runtime.InteropServices; using System.Text;
          public static class W {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t);
            [DllImport("user32.dll")] public static extern IntPtr GetSystemMenu(IntPtr h, bool revert);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetMenuStringW(IntPtr m, uint id, StringBuilder s, int n, uint flags);
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            // The visible windows of a process, as "class | title" lines.
            public static string List(uint pid) {
              var all = new StringBuilder();
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && IsWindowVisible(h)) {
                  var c = new StringBuilder(256); var t = new StringBuilder(256);
                  GetClassNameW(h, c, 256); GetWindowTextW(h, t, 256);
                  all.AppendLine(c + " | " + t);
                }
                return true;
              }, IntPtr.Zero);
              return all.ToString();
            }
          }
          '@
          $h = [W]::FindWindowW("Zed::Window", "Asterism")
          if ($h -eq [IntPtr]::Zero) { throw "no Asterism window" }
          $menu = [W]::GetSystemMenu($h, $false)
          foreach ($id in 0x1010, 0x1020, 0x1030) {
            $text = New-Object System.Text.StringBuilder 128
            [void][W]::GetMenuStringW($menu, $id, $text, 128, 0)
            "window menu item ${id}: $text"
            if ($text.Length -eq 0) { throw "window menu item $id missing" }
          }
          $second = Start-Process target\release\asterism.exe -ArgumentList "--dock-action", "0" -PassThru
          if (-not $second.WaitForExit(15000)) { throw "the second asterism.exe kept running instead of handing over" }
          "second asterism.exe exited with $($second.ExitCode)"
          Start-Sleep 4
          $windows = [W]::List([uint32]$p.Id)
          "Asterism's windows:"; $windows
          if ($p.HasExited) { Get-Content asterism-err.txt -ErrorAction SilentlyContinue; throw "Asterism quit with code $($p.ExitCode)" }
          if ($windows -notmatch '#32770') { Get-Content asterism-err.txt -ErrorAction SilentlyContinue; throw "no dialog after Check for updates" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($img).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $img.Save("$PWD\windows.png")
          if ($p.HasExited) { throw "Asterism quit with code $($p.ExitCode)" }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-windows
          path: windows.png
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          $v = "${{ needs.check.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = (Resolve-Path target\release\asterism.exe).Path
          $out = (Join-Path (Resolve-Path dist).Path "Asterism-$v-windows-x64-setup.exe")
          Push-Location scripts\windows
          makensis /DVERSION=$v /DEXE=$exe /DOUTFILE=$out asterism.nsi
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  # The agent the app copies over SSH to other machines (VMs, servers): static, so any Linux runs it.
  agents:
    needs: check
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, arch: x64, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p asterism-cli --target ${{ matrix.target }}
      - name: The agent starts and says its version
        run: |
          v=${{ needs.check.outputs.version }}
          mkdir -p dist home/.claude/projects
          out=dist/asterism-agent-$v-linux-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/asterism-cli "$out"
          file "$out" | grep -Eq 'statically linked|static-pie linked'  # no system library needed
          first=$( (sleep 3) | HOME=$PWD/home "$out" serve | head -1)
          echo "$first"
          [ "$first" = "{\"asterism\":\"$v\"}" ]
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [check, macos, windows, agents]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.check.outputs.version }}
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          cat > ../notes.md <<EOF
          ## Install

          **macOS:** download \`Asterism-$v-macos-arm64.dmg\` (Apple silicon: M1 and later) or \`Asterism-$v-macos-x64.dmg\`
          (Intel), open it and drag Asterism to Applications. Or, with Homebrew:
          \`brew trust --cask flav-code/tap/asterism && brew install --cask flav-code/tap/asterism\`. The app is not
          signed yet: the first time you open it, macOS blocks it; go to System Settings > Privacy & Security and click
          Open Anyway.

          **Windows:** download \`Asterism-$v-windows-x64-setup.exe\` and run it. It installs for your user only, without
          administrator rights (uninstall it from Settings > Apps). The installer is not signed yet: if SmartScreen
          shows "Windows protected your PC", choose More info, then Run anyway. Or, with Scoop:
          \`scoop bucket add flav-code https://github.com/flav-code/scoop-bucket\`, then \`scoop install flav-code/asterism\`.
          Windows support is new: please open an issue if something looks wrong.

          **Other machines:** sessions on your VMs and servers show too (the server button at the top right). Asterism
          reaches them with \`ssh\` and copies its agent there itself: \`asterism-agent-$v-linux-*\` (Linux, x64 and arm64).

          **Updates:** Asterism checks for new versions on its own. When one is ready, a green arrow shows at the top
          right of the window: click it to restart on the new version.

          Checksums are in \`SHA256SUMS.txt\`.
          EOF
          sed -i 's/^          //' ../notes.md
          TAG=$GITHUB_REF_NAME
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --title "Asterism $v" --notes-file ../notes.md --generate-notes
          fi
