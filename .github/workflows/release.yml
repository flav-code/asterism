# Publishes a release when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0):
# the macOS disk images (Apple silicon and Intel) and the Windows installer, attached to a GitHub release.
# The app's own updater reads that release. Run by hand, it builds everything but publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: check
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: TARGET=${{ matrix.target }} scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/*.dmg

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p asterism
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          $v = "${{ needs.check.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = (Resolve-Path target\release\asterism.exe).Path
          $out = (Join-Path (Resolve-Path dist).Path "Asterism-$v-windows-x64-setup.exe")
          Push-Location scripts\windows
          makensis /DVERSION=$v /DEXE=$exe /DOUTFILE=$out asterism.nsi
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  publish:
    needs: [check, macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.check.outputs.version }}
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          cat > ../notes.md <<EOF
          ## Install

          **macOS:** download \`Asterism-$v-macos-arm64.dmg\` (Apple silicon: M1 and later) or \`Asterism-$v-macos-x64.dmg\`
          (Intel), open it and drag Asterism to Applications. Or, with Homebrew:
          \`brew trust --cask flav-code/tap/asterism && brew install --cask flav-code/tap/asterism\`. The app is not
          signed yet: the first time you open it, macOS blocks it; go to System Settings > Privacy & Security and click
          Open Anyway.

          **Windows:** download \`Asterism-$v-windows-x64-setup.exe\` and run it. It installs for your user only, without
          administrator rights (uninstall it from Settings > Apps). The installer is not signed yet: if SmartScreen
          shows "Windows protected your PC", choose More info, then Run anyway. Or, with Scoop:
          \`scoop bucket add flav-code https://github.com/flav-code/scoop-bucket\`, then \`scoop install flav-code/asterism\`.
          Windows support is new: please open an issue if something looks wrong.

          **Updates:** Asterism checks for new versions on its own. When one is ready, a green arrow shows at the top
          right of the window: click it to restart on the new version.

          Checksums are in \`SHA256SUMS.txt\`.
          EOF
          sed -i 's/^          //' ../notes.md
          TAG=$GITHUB_REF_NAME
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --title "Asterism $v" --notes-file ../notes.md --generate-notes
          fi
