# Publishes a release when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0):
# the macOS disk images (Apple silicon and Intel) and the Windows installer, attached to a GitHub release.
# The app's own updater reads that release. Run by hand, it builds everything but publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: check
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: TARGET=${{ matrix.target }} scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/*.dmg

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p asterism
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          $v = "${{ needs.check.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = (Resolve-Path target\release\asterism.exe).Path
          $out = (Join-Path (Resolve-Path dist).Path "Asterism-$v-windows-x64-setup.exe")
          Push-Location scripts\windows
          makensis /DVERSION=$v /DEXE=$exe /DOUTFILE=$out asterism.nsi
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  publish:
    needs: [check, macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          TAG=$GITHUB_REF_NAME
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --title "Asterism ${{ needs.check.outputs.version }}" --generate-notes
